name: Weekly city prospect report

# Emails the current prospect CSV to the city recipient list.
#
# MANUAL-ONLY. The primary (and only automatic) trigger is the in-process scheduler
# in the API (node-cron, 08:00 America/Los_Angeles, DST-correct), backed by catch-up
# on restart. The GitHub Actions *schedule* trigger was removed on 2026-10-20: it
# fired 5+ hours late (GitHub cron is best-effort) and, combined with an idempotency
# bug, caused a duplicate send. This workflow remains for on-demand manual runs only.
# The report endpoint is idempotent per ISO week, so a manual run no-ops if the week
# was already sent (use with care).

on:
  workflow_dispatch: {}

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: POST to city-export endpoint
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -X POST "${API_BASE_URL}/api/reports/city-export" \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP $code"
          cat /tmp/out.json || true
          echo
          # Fail the job on any non-2xx so a broken report is visible.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "city-export failed with HTTP $code"
            exit 1
          fi
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
