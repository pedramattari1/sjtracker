name: Weekly city prospect report

# Emails the current prospect CSV to the city recipient list.
#
# This is now a TERTIARY backup. The primary trigger is the in-process scheduler
# in the API (node-cron, 08:00 America/Los_Angeles, DST-correct), with an external
# cron (cron-job.org) as secondary. The report is idempotent per ISO week, so this
# job no-ops if the report already went out that week.
#
# NOTE: GitHub Actions cron is always UTC, best-effort, and most delayed at the top
# of the hour — so we use minute 7, not 0. `7 15 * * 1` = Mondays 15:07 UTC = 08:07
# PDT / 07:07 PST (drifts 1h with DST). Because delivery no longer depends on this
# job's punctuality, the drift/delay is harmless.
#
# NOTE: GitHub disables scheduled workflows after 60 days of no repo activity.
# Any commit re-arms it; you can also trigger it manually below.

on:
  schedule:
    - cron: "7 15 * * 1" # Mondays 15:07 UTC (backup; primary is the API scheduler)
  workflow_dispatch: {}

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: POST to city-export endpoint
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -X POST "${API_BASE_URL}/api/reports/city-export" \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP $code"
          cat /tmp/out.json || true
          echo
          # Fail the job on any non-2xx so a broken report is visible.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "city-export failed with HTTP $code"
            exit 1
          fi
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
